  <style>
    body {
      background-color: black;

      color: white;
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-top: 2rem;
    }

    .shadow {
      font-size: 10vw;
      -webkit-text-stroke: 2px red;
      text-shadow: 0 0 20px white;
      margin: 0;
    }

    /* CHAPTER TEXT */
    .fairytale {
      text-align: center;
      margin: 2rem auto;
      font-size: 1.5vw;
    }

    /* MAIN CONTENT CONTAINER */
    .image_container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 1rem;
      text-align: center;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 2rem auto;
    }

    /* RESPONSIVE VIDEO STYLE (APPLIES TO ALL VIDEOS) */
    video {
      width: 100%;
      max-width: 900px;
      height: auto;
      display: block;
      margin: 2.5rem auto;
      background-color: black;
      border: 2px solid #444;
    }

    /* FOOTER NAVIGATION */
    .footer {
      position: fixed;
      bottom: 1rem;
      font-size: 1.2vw;
    }

    .footer.left { left: 1rem; }
    .footer.right { right: 1rem; }
    .footer.center {
      left: 50%;
      transform: translateX(-50%);
    }

    a {
      color: white;
      text-decoration: none;
      text-shadow: 0 0 10px white;
    }

    a:hover {
      color: yellow;
    }

    /* MOBILE ADJUSTMENTS */
    @media (max-width: 768px) {
      .shadow { font-size: 14vw; }
      .fairytale { font-size: 4vw; }
      .footer { font-size: 4vw; }
    }
  </style>
</head>
